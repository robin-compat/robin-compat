version: 2

updates:
  # The actions every workflow uses, and the composite actions in
  # .github/actions/.
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: daily
    cooldown:
      default-days: 7

  # The main Gemfile, and the interop tests' (the real Sidekiq they run
  # against).
  - package-ecosystem: bundler
    directories:
      - /
      - /test/interop
    schedule:
      interval: daily
    cooldown:
      default-days: 7
