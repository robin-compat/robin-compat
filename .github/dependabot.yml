version: 2

updates:
  # The actions every workflow uses, and the composite actions in
  # .github/actions/.
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: daily
    cooldown:
      default-days: 7

  # The main Gemfile, and the interop tests' (the real Sidekiq they run
  # against).
  - package-ecosystem: bundler
    directories:
      - /
      - /test/interop
    schedule:
      interval: daily
    cooldown:
      default-days: 7

  # The interop tests' Sidekiq 8.0: it stays 8.0, so only patch releases
  # of it are proposed.
  - package-ecosystem: bundler
    directory: /test/interop/sidekiq-8.0
    schedule:
      interval: daily
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: sidekiq
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
