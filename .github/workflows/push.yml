name: Push the gem to RubyGems

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  push:
    if: github.repository == 'robin-compat/robin-compat'
    runs-on: ubuntu-latest
    environment:
      name: rubygems.org
      url: https://rubygems.org/gems/robin-compat
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v7
      # CRuby 3.4: Sigstore signing (sigstore-ruby) fails on Ruby 4.0.
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
      # configure-rubygems-credentials v2.1.0 cannot assert an owner yet.
      # First publication requires the account's immutable RubyGems ID.
      - name: Configure RubyGems credentials
        uses: actions/github-script@v9
        env:
          RUBYGEMS_OWNER: ${{ vars.RUBYGEMS_OWNER }}
        with:
          script: |
            const jwt = await core.getIDToken('rubygems.org');
            const response = await fetch('https://rubygems.org/api/v1/oidc/trusted_publisher/exchange_token', {
              method: 'POST',
              headers: {'Content-Type': 'application/json', Accept: 'application/json'},
              body: JSON.stringify({jwt, owner: process.env.RUBYGEMS_OWNER || undefined})
            });
            if (!response.ok) {
              throw new Error(`RubyGems OIDC exchange failed: HTTP ${response.status}`);
            }
            const {rubygems_api_key: apiKey} = await response.json();
            if (typeof apiKey !== 'string' || !apiKey) {
              throw new Error('RubyGems OIDC exchange returned no API key');
            }
            core.setSecret(apiKey);
            core.exportVariable('GEM_HOST_API_KEY', apiKey);
      - name: Update RubyGems
        run: gem update --system
      - name: Build the gem
        run: gem build robin-compat.gemspec
      - name: Sign the gem with Sigstore
        run: |
          for gem in robin-compat-*.gem; do
            gem exec sigstore-cli sign "$gem" --bundle "${gem%.gem}.gem.sigstore.json"
          done
      - name: Push the gem
        run: |
          for gem in robin-compat-*.gem; do
            gem push "$gem" --attestation "${gem%.gem}.gem.sigstore.json" || {
              echo "gem push failed: checking whether it's published already"
              curl --silent --fail --output /dev/null "$(ruby -rrubygems/package -e 'spec = Gem::Package.new(ARGV[0]).spec; print "https://rubygems.org/api/v2/rubygems/#{spec.name}/versions/#{spec.version}.json?platform=#{spec.platform}"' "$gem")" && echo "Already published, continuing" || exit 1
            }
          done
      - name: Wait for release
        run: gem exec rubygems-await robin-compat-*.gem
      - name: Create GitHub release
        run: |
          tag_name="$(git describe --tags --abbrev=0)"
          gh release view "${tag_name}" >/dev/null 2>&1 || \
            gh release create "${tag_name}" --verify-tag --generate-notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
